name: Build for reMarkable
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test bitmap scaling
        run: make test-bitmap
      - name: Build Docker image
        run: make image
      - name: Build
        run: make build
      - name: Archive binary
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: |
            netsurf/nsfb
      - name: Package resources
        if: startsWith(github.ref, 'refs/tags/')
        run: tar -C ./netsurf -cvzf nsfb.tar.gz resources/ nsfb
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            LICENSE
            nsfb.tar.gz
            netsurf/nsfb
